name: Build

on:
  pull_request:
    branches:
      - Architecture-1.21.1
  push:
    branches:
      - Architecture-1.21.1

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Fabric and NeoForge
        run: ./gradlew clean :fabric:build :neoforge:build
